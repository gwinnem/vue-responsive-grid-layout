version: 2

# Weekly dependency update PRs, gated by the CI workflow above like any
# other PR — nothing auto-merges without CI passing (auto-merge itself
# isn't configured here; that's a repository-settings decision, not a
# dependabot.yml one, and worth holding off on until CI has a track record
# of being trustworthy — see docs/REFACTOR_STRATEGY.md).
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk devDependency patch/minor bumps into one PR instead
      # of one PR per package — most of what churns weekly here is
      # tooling (eslint plugins, @types/*, etc.), not runtime dependencies.
      dev-dependencies:
        dependency-type: 'development'
        update-types: ['patch', 'minor']
    commit-message:
      # Matches this project's existing conventional-commit convention
      # (commitizen / cz-conventional-changelog).
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'ci'
    labels:
      - 'dependencies'
      - 'ci'
